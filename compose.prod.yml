services:
  app:
    image: hyunj11/aaction_be:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      DB_HOST: mysql
      DB_NAME: drjudge
      DB_USERNAME: drjudge
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      FLYWAY_OUT_OF_ORDER: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI 서비스는 별도 서버(가비아 클라우드, 해커톤 지원분)에 떠 있음 — 8/28까지 한시적.
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_ALLOWED_REDIRECT_URIS: ${KAKAO_ALLOWED_REDIRECT_URIS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # TODO: /actuator/health가 SecurityConfig에서 permitAll인데도 401을 반환하는
      # 원인 불명(Spring Boot 4/Security 7 조합에서 나타남, 시간 없어서 우회함) —
      # 확실히 permitAll로 동작하는 걸로 확인된 경로를 임시로 사용.
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger-ui/index.html"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: drjudge
      MYSQL_USER: drjudge
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data: