services:
  app:
    image: hyunj11/aaction_be:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      DB_HOST: mysql
      DB_NAME: drjudge
      DB_USERNAME: drjudge
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      FLYWAY_OUT_OF_ORDER: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: drjudge
      MYSQL_USER: drjudge
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data: