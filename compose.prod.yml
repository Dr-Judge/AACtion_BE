services:
  app:
    image: hyunj11/aaction_be:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      DB_HOST: mysql
      DB_NAME: drjudge
      DB_USERNAME: drjudge
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      FLYWAY_OUT_OF_ORDER: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI 서비스는 별도 서버(가비아 클라우드, 해커톤 지원분)에 떠 있음 — 8/28까지 한시적.
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_ALLOWED_REDIRECT_URIS: ${KAKAO_ALLOWED_REDIRECT_URIS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8
    restart: always
    # 아카이브 CSV 동기화(sync_archive_csv.py, ingest.py)를 로컬/가비아 서버에서 직접
    # 돌리려고 노출. 보안그룹에서 특정 IP(작업자 IP, 가비아 서버 IP)로만 접근 허용할 것.
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: drjudge
      MYSQL_USER: drjudge
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data: