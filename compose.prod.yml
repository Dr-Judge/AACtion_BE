services:
  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 # 2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 컨테이너가 떠 있다고 인증서 발급·리버스프록시까지 됐다는 보장은 없다 —
      # 실제로 app까지 프록시되는지 확인한다. --resolve로 DNS/외부 라우팅 없이
      # 127.0.0.1로 직접 붙으면서도 TLS는 실제 도메인 이름으로 협상하므로,
      # 인증서 체인·호스트네임 검증까지 정상적으로 된다(우회 없음).
      test: ["CMD", "curl", "-fsS", "--resolve", "13-124-27-143.sslip.io:443:127.0.0.1", "https://13-124-27-143.sslip.io/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: hyunj11/aaction_be:${IMAGE_TAG:-latest}
    restart: always
    # 호스트 포트로 안 열어둔다 — Caddy를 거치지 않고 평문 HTTP로 바로 붙는 우회로가
    # 생기면 HTTPS를 붙인 의미가 없어진다. 같은 compose 네트워크 안에서 caddy가
    # app:8080으로 접근하는 건 호스트 포트 매핑 없이도 그대로 된다.
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      DB_HOST: mysql
      DB_NAME: drjudge
      DB_USERNAME: drjudge
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      FLYWAY_OUT_OF_ORDER: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI 서비스는 별도 서버(가비아 클라우드, 해커톤 지원분)에 떠 있음 — 8/28까지 한시적.
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_ALLOWED_REDIRECT_URIS: ${KAKAO_ALLOWED_REDIRECT_URIS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      # 값이 비어있으면 IMAGE/LINK 판정만 EXTRACTION_FAILED로 처리되고 앱 기동엔 영향 없음.
      CLOVA_OCR_API_URL: ${CLOVA_OCR_API_URL:-}
      CLOVA_OCR_SECRET_KEY: ${CLOVA_OCR_SECRET_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8
    restart: always
    # 아카이브 CSV 동기화(sync_archive_csv.py, ingest.py)를 로컬/가비아 서버에서 직접
    # 돌리려고 노출. 보안그룹에서 특정 IP(작업자 IP, 가비아 서버 IP)로만 접근 허용할 것.
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: drjudge
      MYSQL_USER: drjudge
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config: