# 테스트 전용 설정 — src/main/resources/application.yaml을 완전히 대체한다
# (Gradle 테스트 클래스패스에서 동일 파일명은 병합이 아니라 대체됨)
#
# 실제 MySQL 없이 컨텍스트가 뜨도록 H2 인메모리 + Flyway 비활성화로 구성.
# 그래서 마이그레이션 파일의 문법/제약 오류는 여기서 안 잡힌다 — 그건 CI의
# migration-check 잡(실제 MySQL 대상)이 담당한다. 로컬에서도 실제 MySQL로 한 번은
# 확인해야 한다 (docs/LOCAL_SETUP.md 참고).

spring:
  application:
    name: Dr-Judge
  datasource:
    url: jdbc:h2:mem:drjudge;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  access-token-validity: 36000000 # 10시간
  refresh-token-validity: 1209600000 # 14일

app:
  ai-service:
    base-url: http://localhost:8000
    api-key: test-ai-service-key