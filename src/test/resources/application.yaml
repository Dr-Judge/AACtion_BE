spring:
  application:
    name: Dr-Judge
  datasource:
    url: jdbc:h2:mem:drjudge;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  access-token-validity: 10800000 # 3시간
  refresh-token-validity: 1209600000 # 14일

kakao:
  client-id: test-kakao-client-id
  client-secret:

app:
  ai-service:
    base-url: http://localhost:8000
    api-key: test-ai-service-key