spring:
  application:
    name: Dr-Judge
  config:
    import: optional:file:./application-secret.yml
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:36000000}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000}

app:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL}
    api-key: ${AI_SERVICE_API_KEY}

server:
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health