spring:
  application:
    name: Dr-Judge
  config:
    import: optional:file:./application-secret.yml
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:10800000}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS}

# 값이 비어있으면 해당 입력 타입(IMAGE/LINK)만 EXTRACTION_FAILED로 처리되고
# 앱 기동 자체는 막지 않는다 (필수 프로퍼티로 만들었다가 배포 사고 낸 적 있어서 전부 기본값 둠).
clova:
  ocr:
    api-url: ${CLOVA_OCR_API_URL:}
    secret-key: ${CLOVA_OCR_SECRET_KEY:}

youtube:
  api-key: ${YOUTUBE_API_KEY:}

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL}
    api-key: ${AI_SERVICE_API_KEY}
  judgment:
    daily-limit: ${JUDGMENT_DAILY_LIMIT:5}

server:
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

