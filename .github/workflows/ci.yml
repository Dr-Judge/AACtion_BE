name: CI
on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build & test (H2)
        run: ./gradlew build

  migration-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drjudge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Flyway migrate against MySQL
        run: |
          docker run --rm --network=host \
            -v ${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql \
            flyway/flyway:10.8.1 \
            -url="jdbc:mysql://localhost:3306/drjudge?allowPublicKeyRetrieval=true" -user=root -password=root \
            migrate
