name: CD
on:
  push:
    branches: [main]

permissions:
  contents: read

# 겹치는 배포가 순서 뒤바뀌어 실행되어도 최신 배포를 덮어쓰지 않도록 직렬화한다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — 시크릿 다루는 잡 앞단이라 SHA 고정
      - name: Compute image name
        id: image
        run: echo "name=${{ secrets.DOCKERHUB_USERNAME }}/aaction_be" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0 — 시크릿 다루는 서드파티 액션이라 SHA 고정
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5 — 로그인 이후 실행되고 자격증명에 접근 가능한 서드파티 액션이라 SHA 고정
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ec2-prod]
    steps:
      # 러너에 예전부터 놓여있던 파일이 아니라, 이 커밋 시점의 compose.prod.yml을 그대로 쓴다
      # (안 그러면 실제 배포 파일이 저장소랑 계속 어긋나도 아무도 못 알아챈다 — 실제로 이 문제로
      # 8/8 이후 배포가 전부 옛날 GHCR 이미지만 재확인하고 있었음).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — deploy job은 운영 서버 접근 권한이 있는 self-hosted 러너에서 실행되어 SHA 고정
        with:
          persist-credentials: false
      - name: Pull & restart (커밋 SHA로 고정된 이미지, healthy 될 때까지 대기)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd ~/drjudge
          cp "$GITHUB_WORKSPACE/compose.prod.yml" compose.prod.yml
          cp "$GITHUB_WORKSPACE/Caddyfile" Caddyfile
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d --force-recreate --wait --wait-timeout 60
