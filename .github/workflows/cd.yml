name: CD
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        id: image
        run: echo "name=${{ secrets.DOCKERHUB_USERNAME }}/aaction_be" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0 — 시크릿 다루는 서드파티 액션이라 SHA 고정
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ec2-prod]
    steps:
      - name: Pull & restart
        run: |
          cd ~/drjudge
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d
